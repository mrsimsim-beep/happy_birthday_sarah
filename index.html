<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Martin Birthday Countdown</title>
    <link rel="preload" as="image" href="https://ici.radio-canada.ca/audio-video/lib/img/extraits/HR/2021-01-23_19_00_00_ENDIRECT_0294_01_01.jpeg">
    <link rel="preload" as="image" href="https://les-as-de-l-info.s3.amazonaws.com/images/1684892780-1684874665-MartinDeschamps_2019-1813_HR_featured_image_single_960_540.jpg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            background: #000;
            color: #fff;
            font-family: 'Impact', 'Arial Black', sans-serif;
            height: 100%;
            width: 100%;
            overflow: hidden;
            position: fixed;
            touch-action: none;
        }
        
        #countdown {
            font-size: 30vw;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff0000,
                0 0 80px #ff6600;
            animation: pulse 0.5s ease-in-out;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            line-height: 1;
            text-align: center;
            width: 100%;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        
        .image-stage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-image {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center center;
            transform-origin: center center;
            -webkit-transform-origin: center center;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            will-change: transform;
        }
        
        #birthdayStage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #2a1a1a 0%, #000 100%);
        }
        
        #birthdayText {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8vw;
            text-align: center;
            z-index: 100;
            color: #fff;
            text-shadow: 
                0 0 20px #ff0000,
                0 0 40px #ff6600,
                0 0 60px #ffd700;
            animation: birthdayPulse 2s ease-in-out infinite;
            line-height: 1.2;
            pointer-events: none;
            white-space: nowrap;
        }
        
        @keyframes birthdayPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
        
        .name-input {
            font-size: 0.6em;
            color: #ffd700;
            display: block;
            margin-top: 20px;
        }
        
        #splashCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            pointer-events: none;
        }
        
        #restartBtn {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #ff0000, #ff6600);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 200;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            -webkit-tap-highlight-color: transparent;
        }
        
        #restartBtn:hover, #restartBtn:active {
            transform: translateX(-50%) scale(1.1);
        }
        
        @media (max-width: 768px) {
            #birthdayText {
                font-size: 12vw;
            }
        }
    </style>
</head>
<body>
    <div id="countdown">5</div>
    
    <div id="stage1" class="image-stage">
        <img id="img1" class="zoom-image" src="https://ici.radio-canada.ca/audio-video/lib/img/extraits/HR/2021-01-23_19_00_00_ENDIRECT_0294_01_01.jpeg" alt="Martin 1" decoding="async">
    </div>
    
    <div id="stage2" class="image-stage">
        <img id="img2" class="zoom-image" src="https://les-as-de-l-info.s3.amazonaws.com/images/1684892780-1684874665-MartinDeschamps_2019-1813_HR_featured_image_single_960_540.jpg" alt="Martin 2" decoding="async">
    </div>
    
    <div id="birthdayStage">
        <canvas id="splashCanvas"></canvas>
        <div id="birthdayText">
            BONNE FÊTE CONNASSE
            <span class="name-input"> </span>
        </div>
    </div>
    
    <button id="restartBtn" onclick="location.reload()">↻ Watch Again</button>

    <script>
        const ZOOM_CONFIG = {
            image1: {
                startScale: 1,
                endScale: 2.3,
                duration: 1000,
                direction: 'in',
                easing: 'ease-in-out',
                focusX: 0,
                focusY: 90
            },
            
            image2: {
                startScale: 1,
                endScale: 3,
                duration: 1000,
                direction: 'in',
                easing: 'ease-in-out',
                focusX: 97,
                focusY: 100
            }
        };
        
        class LiquidSplash {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.particles = [];
                this.droplets = [];
                this.splashes = [];
            }
            
            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
            }
            
            createSplash(x, y, type, intensity = 1) {
                const config = this.getSplashConfig(type);
                this.splashes.push(new SplashBlob(x, y, config, intensity));
                
                const particleCount = Math.floor(30 * intensity);
                for (let i = 0; i < particleCount; i++) {
                    this.particles.push(new LiquidParticle(x, y, config, intensity));
                }
                
                const dropletCount = Math.floor(20 * intensity);
                for (let i = 0; i < dropletCount; i++) {
                    this.droplets.push(new Droplet(x, y, config, intensity));
                }
            }
            
            getSplashConfig(type) {
                const configs = {
                    garlic: {
                        color: { r: 255, g: 248, b: 220 },
                        secondaryColor: { r: 255, g: 255, b: 240 },
                        viscosity: 0.7,
                        gravity: 0.4,
                        spread: 1.2,
                        shine: 0.8,
                        opacity: 0.9
                    },
                    pomegranate: {
                        color: { r: 10, g: 0, b: 10 },
                        secondaryColor: { r: 40, g: 0, b: 20 },
                        viscosity: 0.9,
                        gravity: 0.5,
                        spread: 0.8,
                        shine: 0.4,
                        opacity: 0.95
                    },
                    shawarma: {
                        color: { r: 79, g: 51, b: 36 },
                        secondaryColor: { r: 160, g: 120, b: 90 },
                        viscosity: 0.8,
                        gravity: 0.6,
                        spread: 1.0,
                        shine: 0.3,
                        opacity: 1.0
                    }
                };
                return configs[type] || configs.garlic;
            }
            
            update() {
                this.splashes = this.splashes.filter(splash => {
                    splash.update();
                    return splash.life > 0;
                });
                
                this.particles = this.particles.filter(p => {
                    p.update();
                    return p.life > 0 && p.y < this.height + 100;
                });
                
                this.droplets = this.droplets.filter(d => {
                    d.update();
                    return d.life > 0 && d.y < this.height + 50;
                });
            }
            
            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);
                this.splashes.forEach(splash => splash.draw(this.ctx));
                this.particles.forEach(p => p.draw(this.ctx));
                this.droplets.forEach(d => d.draw(this.ctx));
            }
            
            animate() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }
        
        class SplashBlob {
            constructor(x, y, config, intensity) {
                this.x = x;
                this.y = y;
                this.config = config;
                this.life = 1.0;
                this.decay = 0.015;
                
                this.points = [];
                const radius = (80 + Math.random() * 60) * intensity;
                const points = 12;
                
                for (let i = 0; i < points; i++) {
                    const angle = (i / points) * Math.PI * 2;
                    const r = radius * (0.7 + Math.random() * 0.6);
                    this.points.push({
                        x: Math.cos(angle) * r,
                        y: Math.sin(angle) * r,
                        angle: angle
                    });
                }
                
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4 - 2;
                this.scale = 0.1;
                this.targetScale = 1 + Math.random() * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.rotation += this.rotationSpeed;
                
                if (this.scale < this.targetScale) {
                    this.scale += (this.targetScale - this.scale) * 0.2;
                }
                
                this.life -= this.decay;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale);
                
                const gradient = ctx.createRadialGradient(-20, -20, 0, 0, 0, 100);
                const c = this.config.color;
                const s = this.config.secondaryColor;
                
                gradient.addColorStop(0, `rgba(${s.r}, ${s.g}, ${s.b}, ${this.life * this.config.opacity})`);
                gradient.addColorStop(0.5, `rgba(${c.r}, ${c.g}, ${c.b}, ${this.life * this.config.opacity})`);
                gradient.addColorStop(1, `rgba(${c.r * 0.7}, ${c.g * 0.7}, ${c.b * 0.7}, ${this.life * this.config.opacity})`);
                
                ctx.fillStyle = gradient;
                
                ctx.beginPath();
                this.points.forEach((p, i) => {
                    const x = p.x * (0.9 + Math.sin(Date.now() * 0.003 + i) * 0.1);
                    const y = p.y * (0.9 + Math.cos(Date.now() * 0.003 + i) * 0.1);
                    
                    if (i === 0) ctx.moveTo(x, y);
                    else {
                        const prev = this.points[i - 1];
                        const cpX = (prev.x + x) / 2;
                        const cpY = (prev.y + y) / 2;
                        ctx.quadraticCurveTo(prev.x, prev.y, cpX, cpY);
                    }
                });
                ctx.closePath();
                ctx.fill();
                
                if (this.config.shine > 0) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.life * this.config.shine * 0.3})`;
                    ctx.beginPath();
                    ctx.ellipse(-30, -30, 25, 15, Math.PI / 4, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }
        
        class LiquidParticle {
            constructor(x, y, config, intensity) {
                this.x = x;
                this.y = y;
                this.config = config;
                this.life = 1.0;
                this.decay = 0.01 + Math.random() * 0.01;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = (5 + Math.random() * 15) * intensity * config.spread;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - Math.random() * 10;
                
                this.size = (5 + Math.random() * 15) * intensity;
                this.stretch = 1;
                this.history = [];
            }
            
            update() {
                this.history.push({ x: this.x, y: this.y });
                if (this.history.length > 5) this.history.shift();
                
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.config.gravity;
                this.vx *= 0.99;
                
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                this.stretch = 1 + speed * 0.05;
                
                this.life -= this.decay;
                this.size *= 0.995;
            }
            
            draw(ctx) {
                if (this.life <= 0 || this.size < 0.5) return;
                
                ctx.save();
                
                const c = this.config.color;
                const alpha = this.life * this.config.opacity;
                
                if (this.history.length > 1) {
                    ctx.strokeStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha * 0.5})`;
                    ctx.lineWidth = this.size * 0.5;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    this.history.forEach((h, i) => {
                        if (i === 0) ctx.moveTo(h.x, h.y);
                        else ctx.lineTo(h.x, h.y);
                    });
                    ctx.stroke();
                }
                
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.vy, this.vx));
                ctx.scale(this.stretch, 1 / this.stretch);
                
                const grad = ctx.createRadialGradient(-this.size/3, -this.size/3, 0, 0, 0, this.size);
                grad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.8})`);
                grad.addColorStop(0.3, `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`);
                grad.addColorStop(1, `rgba(${c.r * 0.5}, ${c.g * 0.5}, ${c.b * 0.5}, ${alpha})`);
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(0, 0, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.6})`;
                ctx.beginPath();
                ctx.arc(-this.size * 0.3, -this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class Droplet {
            constructor(x, y, config, intensity) {
                this.x = x;
                this.y = y;
                this.config = config;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.02;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = (2 + Math.random() * 8) * intensity;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - Math.random() * 5;
                
                this.size = (2 + Math.random() * 6) * intensity;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.config.gravity * 1.2;
                this.life -= this.decay;
            }
            
            draw(ctx) {
                if (this.life <= 0) return;
                
                const c = this.config.color;
                const alpha = this.life * this.config.opacity;
                
                ctx.fillStyle = `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.5})`;
                ctx.beginPath();
                ctx.arc(this.x - this.size * 0.3, this.y - this.size * 0.3, this.size * 0.2, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        let liquidSystem;
        let count = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            count--;
            
            if (count >= 3) {
                countdownEl.textContent = count;
                countdownEl.style.animation = 'none';
                setTimeout(() => countdownEl.style.animation = 'pulse 0.5s ease-in-out', 10);
            } else if (count === 2) {
                clearInterval(timer);
                countdownEl.style.display = 'none';
                showImageWithZoom('stage1', 'img1', ZOOM_CONFIG.image1, () => {
                    setTimeout(() => {
                        showImageWithZoom('stage2', 'img2', ZOOM_CONFIG.image2, () => {
                            setTimeout(showBirthday, 500);
                        });
                    }, 200);
                });
            }
        }, 1000);
        
        function showImageWithZoom(stageId, imgId, config, callback) {
            const stage = document.getElementById(stageId);
            const img = document.getElementById(imgId);
            
            stage.style.display = 'flex';
            
            const setupZoom = () => {
                const viewportW = window.innerWidth;
                const viewportH = window.innerHeight;
                
                const imgNaturalW = img.naturalWidth;
                const imgNaturalH = img.naturalHeight;
                const imgAspect = imgNaturalW / imgNaturalH;
                const viewportAspect = viewportW / viewportH;
                
                let renderedImgW, renderedImgH;
                
                if (imgAspect > viewportAspect) {
                    renderedImgH = viewportH;
                    renderedImgW = viewportH * imgAspect;
                } else {
                    renderedImgW = viewportW;
                    renderedImgH = viewportW / imgAspect;
                }
                
                const offsetX = (renderedImgW - viewportW) / 2;
                const offsetY = (renderedImgH - viewportH) / 2;
                
                const targetX = (config.focusX / 100) * viewportW;
                const targetY = (config.focusY / 100) * viewportH;
                
                const originX = ((targetX + offsetX) / renderedImgW) * 100;
                const originY = ((targetY + offsetY) / renderedImgH) * 100;
                
                img.style.transformOrigin = `${originX}% ${originY}%`;
                
                animateZoom(config, img, stage, callback);
            };
            
            if (img.complete && img.naturalWidth > 0) {
                requestAnimationFrame(setupZoom);
            } else {
                img.onload = () => requestAnimationFrame(setupZoom);
                img.onerror = () => {
                    console.error('Image failed to load');
                    if (callback) callback();
                };
            }
        }
        
        function animateZoom(config, img, stage, callback) {
            let currentScale = config.startScale;
            img.style.transform = `scale(${currentScale})`;
            
            const startTime = performance.now();
            const scaleDiff = config.endScale - config.startScale;
            
            function animate(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / config.duration, 1);
                
                let easedProgress;
                switch(config.easing) {
                    case 'linear':
                        easedProgress = progress;
                        break;
                    case 'ease-in':
                        easedProgress = progress * progress;
                        break;
                    case 'ease-out':
                        easedProgress = 1 - Math.pow(1 - progress, 2);
                        break;
                    case 'ease-in-out':
                        easedProgress = progress < 0.5 
                            ? 2 * progress * progress 
                            : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                        break;
                    default:
                        easedProgress = progress;
                }
                
                currentScale = config.startScale + (scaleDiff * easedProgress);
                img.style.transform = `scale(${currentScale})`;
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(() => {
                        stage.style.display = 'none';
                        if (callback) callback();
                    }, 200);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        function showBirthday() {
            const stage = document.getElementById('birthdayStage');
            stage.style.display = 'block';
            
            const canvas = document.getElementById('splashCanvas');
            liquidSystem = new LiquidSplash(canvas);
            liquidSystem.animate();
            
            setTimeout(() => createFoodSplash('garlic', 10), 300);
            setTimeout(() => createFoodSplash('pomegranate', 10), 800);
            setTimeout(() => createFoodSplash('shawarma', 10), 1300);
            
            setInterval(() => {
                const types = ['garlic', 'pomegranate', 'shawarma'];
                const randomType = types[Math.floor(Math.random() * types.length)];
                createFoodSplash(randomType, 3);
            }, 500);
            
            setTimeout(() => {
                document.getElementById('restartBtn').style.display = 'block';
            }, 3000);
            
            window.addEventListener('resize', () => liquidSystem.resize());
        }
        
        function createFoodSplash(type, count) {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            for (let i = 0; i < count; i++) {
                let x, y;
                const centerX = width / 2;
                const centerY = height / 2;
                
                do {
                    x = Math.random() * width;
                    y = Math.random() * height;
                } while (
                    Math.abs(x - centerX) < 200 && Math.abs(y - centerY) < 100
                );
                
                const intensity = 0.8 + Math.random() * 0.6;
                liquidSystem.createSplash(x, y, type, intensity);
            }
        }
    </script>
</body>
</html>
